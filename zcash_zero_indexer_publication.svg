  <title id="svg-title">Zero-indexer transaction publication</title>
  <desc id="svg-desc">Wallet TLS connections terminate at zero-indexer shims inside trusted execution environments. The shims connect to a hub in another trusted execution environment. Both the hub and the indexers publish to the mempool.</desc>

